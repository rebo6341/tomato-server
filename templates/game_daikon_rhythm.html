<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0ed9b4">
    <title>ヨクソダテール | ダイコンリズム</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='icon.png') }}">
</head>
<body>
    <div class="container">
        <header class="page-header">
            <h1>🎵 ダイコンリズム</h1>
        </header>

        <div class="sub-info">
            4つのレーンに降ってくる🌱をタップ！ 収穫のタイミングでスコアを稼ごう。曲が進むほどノーツが増えていくよ。
        </div>

        <div class="game-stage">
            <div class="game-scoreboard">
                <div class="game-score-item">
                    <div class="game-score-label">スコア</div>
                    <div class="game-score-value" id="score">0</div>
                </div>
                <div class="game-score-item">
                    <div class="game-score-label">コンボ</div>
                    <div class="game-score-value" id="combo">0</div>
                </div>
                <div class="game-score-item">
                    <div class="game-score-label">ハイスコア</div>
                    <div class="game-score-value" id="best">0</div>
                </div>
            </div>

            <div class="rhythm-field" id="field">
                <div class="rhythm-hitline"></div>
                <div class="rhythm-lane" data-lane="0"><div class="rhythm-key">🌱</div></div>
                <div class="rhythm-lane" data-lane="1"><div class="rhythm-key">🌱</div></div>
                <div class="rhythm-lane" data-lane="2"><div class="rhythm-key">🌱</div></div>
                <div class="rhythm-lane" data-lane="3"><div class="rhythm-key">🌱</div></div>
            </div>

            <div class="rhythm-judge" id="judge"></div>
            <p class="game-message" id="message">スタートボタンを押してね（音が鳴ります🔊）</p>

            <div class="footer-action" style="margin-top: 14px;">
                <button type="button" id="start-btn" class="btn btn-success" style="flex:1 1 100%;">
                    <span class="btn-label">▶ スタート</span>
                </button>
            </div>
        </div>

        <div class="footer-action">
            <a href="/games" class="btn btn-secondary" style="flex:1 1 100%;">← ミニゲーム一覧へ戻る</a>
        </div>
        <div class="footer-action">
            <a href="/" class="btn btn-info btn-back-wide">ダッシュボードへ戻る</a>
        </div>
    </div>

    <audio id="bgm" src="{{ url_for('static', filename='audio/daikon_rhythm.mp3') }}" preload="auto"></audio>

<script>
(function () {

87.411,"lane":2},{"t":87.8,"lane":3},{"t":88.389,"lane":1},{"t":88.798,"lane":3},{"t":89.078,"lane":1},{"t":89.377,"lane":2},{"t":89.576,"lane":0},{"t":89.766,"lane":1},{"t":89.966,"lane":2},{"t":90.165,"lane":0},{"t":90.355,"lane":3},{"t":90.654,"lane":0},{"t":90.953,"lane":3},{"t":91.143,"lane":1},{"t":91.293,"lane":2},{"t":91.552,"lane":1},{"t":91.741,"lane":2},{"t":91.991,"lane":3},{"t":92.141,"lane":0},{"t":92.639,"lane":3},{"t":92.789,"lane":1},{"t":93.188,"lane":2},{"t":93.717,"lane":0},{"t":93.966,"lane":1},{"t":94.106,"lane":3},{"t":94.366,"lane":2},{"t":94.615,"lane":0},{"t":94.765,"lane":3},{"t":95.154,"lane":0},{"t":95.283,"lane":2},{"t":95.493,"lane":1},{"t":95.673,"lane":0},{"t":95.802,"lane":2},{"t":95.942,"lane":3},{"t":96.341,"lane":1},{"t":96.73,"lane":3},{"t":97.119,"lane":0},{"t":97.269,"lane":2},{"t":97.518,"lane":1},{"t":97.668,"lane":0},{"t":97.917,"lane":3},{"t":98.317,"lane":1},{"t":98.716,"lane":2},{"t":98.855,"lane":0},{"t":99.105,"lane":1},{"t":99.244,"lane":2},{"t":99.444,"lane":3},{"t":99.634,"lane":1},{"t":99.893,"lane":2},{"t":100.043,"lane":3},{"t":100.282,"lane":0},{"t":100.432,"lane":2},{"t":100.681,"lane":3},{"t":100.811,"lane":1},{"t":101.07,"lane":0},{"t":101.469,"lane":3},{"t":101.859,"lane":0},{"t":102.198,"lane":2},{"t":102.507,"lane":1},{"t":102.647,"lane":2},{"t":103.046,"lane":1},{"t":103.275,"lane":3},{"t":103.575,"lane":0},{"t":103.824,"lane":3},{"t":104.173,"lane":2},{"t":104.373,"lane":0},{"t":104.572,"lane":1},{"t":105.011,"lane":3},{"t":105.41,"lane":1},{"t":105.8,"lane":0},{"t":105.949,"lane":2},{"t":106.199,"lane":0},{"t":106.338,"lane":1},{"t":106.598,"lane":3},{"t":106.737,"lane":2},{"t":106.987,"lane":3},{"t":107.236,"lane":0},{"t":107.376,"lane":2},{"t":107.536,"lane":1},{"t":107.775,"lane":2},{"t":108.114,"lane":1},{"t":108.304,"lane":0},{"t":108.563,"lane":3},{"t":108.952,"lane":1},{"t":109.092,"lane":2},{"t":109.351,"lane":0},{"t":109.481,"lane":3},{"t":109.681,"lane":1},{"t":110.14,"lane":3},{"t":110.529,"lane":2},{"t":110.928,"lane":0},{"t":112.255,"lane":3},{"t":112.444,"lane":0},{"t":112.844,"lane":1},{"t":113.033,"lane":2},{"t":113.233,"lane":1},{"t":113.831,"lane":0},{"t":114.021,"lane":2},{"t":114.32,"lane":3},{"t":114.62,"lane":2},{"t":114.809,"lane":1},{"t":115.098,"lane":3},{"t":115.398,"lane":0},{"t":115.597,"lane":1},{"t":115.887,"lane":3},{"t":116.186,"lane":0},{"t":116.395,"lane":2},{"t":116.665,"lane":3},{"t":117.124,"lane":2}]};

    const APPROACH = 1.1;           // ノーツが降り始めてからヒットラインに届くまでの秒数
    const WINDOW_PERFECT = 0.07;    // PERFECT判定の許容誤差（秒）
    const WINDOW_GOOD = 0.15;       // GOOD判定の許容誤差（秒）
    const WINDOW_MISS_AUTO = 0.18;  // これを過ぎたら未タップでも自動MISS

    const bgm = document.getElementById('bgm');
    const field = document.getElementById('field');
    const laneEls = Array.from(document.querySelectorAll('.rhythm-lane'));
    const scoreEl = document.getElementById('score');
    const comboEl = document.getElementById('combo');
    const bestEl = document.getElementById('best');
    const judgeEl = document.getElementById('judge');
    const msgEl = document.getElementById('message');
    const startBtn = document.getElementById('start-btn');

    let score = 0, combo = 0, maxCombo = 0;
    let perfectCount = 0, goodCount = 0, missCount = 0;
    let best = Number(localStorage.getItem('daikonRhythmBest') || 0);
    bestEl.textContent = best;

    let notes = [];
    let noteIdx = 0;
    let running = false;
    let rafId = null;

    function resetGame() {
        score = 0; combo = 0; maxCombo = 0;
        perfectCount = 0; goodCount = 0; missCount = 0;
        noteIdx = 0;
        notes.forEach(n => n.el && n.el.remove());
        notes = [];
        scoreEl.textContent = '0';
        comboEl.textContent = '0';
        judgeEl.textContent = '';
        judgeEl.className = 'rhythm-judge';
    }

    function judgeNote(n, result) {
        if (n.judged) return;
        n.judged = true;
        if (n.el) {
            n.el.classList.add('is-' + result);
            setTimeout(() => n.el && n.el.remove(), 120);
        }
        if (result === 'perfect') {
            score += 100 + Math.min(combo, 50) * 2;
            perfectCount++; combo++;
        } else if (result === 'good') {
            score += 50 + Math.min(combo, 50);
            goodCount++; combo++;
        } else {
            missCount++; combo = 0;
        }
        maxCombo = Math.max(maxCombo, combo);
        scoreEl.textContent = score;
        comboEl.textContent = combo;
        judgeEl.textContent = result === 'perfect' ? 'PERFECT' : result === 'good' ? 'GOOD' : 'MISS';
        judgeEl.className = 'rhythm-judge ' + result;
    }

    function spawnLoop() {
        const t = bgm.currentTime;
        while (noteIdx < CHART.notes.length && CHART.notes[noteIdx].t - APPROACH <= t) {
            const note = CHART.notes[noteIdx];
            const el = document.createElement('div');
            el.className = 'rhythm-note';
            laneEls[note.lane].appendChild(el);
            notes.push({ t: note.t, lane: note.lane, el, judged: false });
            noteIdx++;
        }

        const laneHeight = field.clientHeight;
        const hitY = laneHeight - 67; // CSSの.rhythm-hitline位置(bottom:54px)・ノーツ高さ(26px)と対応

        for (let i = 0; i < notes.length; i++) {
            const n = notes[i];
            if (n.judged) continue;
            const progress = (t - (n.t - APPROACH)) / APPROACH;
            n.el.style.transform = `translateY(${progress * hitY}px)`;
            if (t - n.t > WINDOW_MISS_AUTO) {
                judgeNote(n, 'miss');
            }
        }

        if (running) {
            rafId = requestAnimationFrame(spawnLoop);
        }
    }

    function handleTap(laneIndex) {
        if (!running) return;
        const t = bgm.currentTime;
        let bestNote = null, bestDiff = Infinity;
        for (const n of notes) {
            if (n.judged || n.lane !== laneIndex) continue;
            const diff = Math.abs(n.t - t);
            if (diff < bestDiff) { bestDiff = diff; bestNote = n; }
        }
        const keyEl = laneEls[laneIndex].querySelector('.rhythm-key');
        if (keyEl) {
            keyEl.classList.add('is-active');
            setTimeout(() => keyEl.classList.remove('is-active'), 90);
        }
        if (bestNote && bestDiff <= WINDOW_GOOD) {
            judgeNote(bestNote, bestDiff <= WINDOW_PERFECT ? 'perfect' : 'good');
        }
    }

    laneEls.forEach((laneEl, idx) => {
        laneEl.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            handleTap(idx);
        });
    });

    const KEY_MAP = { d: 0, f: 1, j: 2, k: 3 };
    window.addEventListener('keydown', (e) => {
        const k = e.key.toLowerCase();
        if (k in KEY_MAP) handleTap(KEY_MAP[k]);
    });

    function endGame() {
        running = false;
        if (rafId) cancelAnimationFrame(rafId);
        const total = perfectCount + goodCount + missCount;
        const acc = total ? ((perfectCount + goodCount * 0.5) / total * 100) : 0;
        let rank = 'C';
        if (acc >= 95) rank = 'S';
        else if (acc >= 85) rank = 'A';
        else if (acc >= 70) rank = 'B';
        if (score > best) {
            best = score;
            localStorage.setItem('daikonRhythmBest', String(best));
        }
        bestEl.textContent = best;
        msgEl.innerHTML = `終了！ ランク <b>${rank}</b>　スコア ${score}　最大コンボ ${maxCombo}<br>PERFECT ${perfectCount} ／ GOOD ${goodCount} ／ MISS ${missCount}`;
        startBtn.querySelector('.btn-label').textContent = '▶ もう一度あそぶ';
        startBtn.disabled = false;
    }

    bgm.addEventListener('ended', endGame);

        startBtn.addEventListener('click', async () => {
        startBtn.disabled = true;
        resetGame();

        // ブラウザの自動再生制限対策：クリック直後に一度再生→即停止して「解錠」しておく
        try {
            bgm.currentTime = 0;
            await bgm.play();
            bgm.pause();
            bgm.currentTime = 0;
        } catch (err) {
            msgEl.textContent = '音声の再生がブロックされました。端末の音量・サイレントモードを確認して、もう一度スタートを押してください。';
            startBtn.disabled = false;
            return;
        }

        let count = 3;
        msgEl.textContent = `まもなくスタート… ${count}`;
        await new Promise((resolve) => {
            const timer = setInterval(() => {
                count--;
                if (count > 0) {
                    msgEl.textContent = `まもなくスタート… ${count}`;
                } else {
                    clearInterval(timer);
                    resolve();
                }
            }, 700);
        });

        msgEl.textContent = 'レーンをタップしてダイコンをキャッチ！';
        running = true;
        try {
            await bgm.play();
        } catch (err) {
            msgEl.textContent = '音声の再生に失敗しました。もう一度スタートを押してください。';
            running = false;
            startBtn.disabled = false;
            return;
        }
        rafId = requestAnimationFrame(spawnLoop);
    });
})();
</script>

</html>
